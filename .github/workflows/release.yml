# SPDX-License-Identifier: AGPL-3.0-or-later
# 推送签名 tag `v*.*.*` 触发发布。
# 前置条件：
# 1. GitHub Environment `npm` 已创建（可加保护规则 / required reviewers）
# 2. npm 上为 @kitsuneflora/ui 配置 Trusted Publisher：
#    - Organization/User: KitsuneFlora
#    - Repository: ui
#    - Workflow: release.yml
#    - Environment: npm
name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run tokens:check
      - run: npm run fmt:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: node scripts/smoke-consumer.mjs

      - name: Resolve npm dist-tag
        id: disttag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *"-alpha"* || "$VERSION" == *"-beta"* || "$VERSION" == *"-rc"* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish to npm (OIDC)
        run: npm publish --access public --provenance --tag "${{ steps.disttag.outputs.tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md \
            --verify-tag
