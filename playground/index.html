<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>foxnature-ui playground</title>
    <script>
      ;(function () {
        try {
          var k = 'foxnature-ui.theme'
          var p = localStorage.getItem(k)
          var d = window.matchMedia('(prefers-color-scheme: dark)').matches
          var r = p === 'light' || p === 'dark' ? p : d ? 'dark' : 'light'
          var el = document.documentElement
          el.setAttribute('data-fx-theme', r)
          el.style.colorScheme = r
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
